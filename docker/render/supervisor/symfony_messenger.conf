[program:messenger-consume]
command=php /var/www/html/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --env=prod -vv
user=root
numprocs=1
startsecs=3
autostart=true
autorestart=true
startretries=3
process_name=%(program_name)s
environment=MESSENGER_CONSUMER_NAME=%(program_name)s
stdout_logfile=/var/log/messenger.log
stderr_logfile=/var/log/messenger.err.log
